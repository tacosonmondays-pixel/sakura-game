     the approved specimen draws it (notes/ui-v2/kit/specimen.html and specimen-844x390.png / -1280x720.png), for
     e2e/ink-kit.mjs, the probe and the pixel probes (e2e/pixels.mjs), and the reviewers' 3x crops. Dev server only
     (http://127.0.0.1:<port>/e2e/fixtures/ink-kit.html): never part of the build (vite builds index.html only).
     Board 6 shows the game's own tiles instead of the mock-up's E5 tile (plan C1: the shipped slanted plate): an item

<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
  /* fixture only: boards are framed 844 x 390 screens; fixed-position kit parts become absolute inside them */
  html, body { height: auto !important; overflow: visible !important; }
  body.spec { margin: 0; background: #c9d3df; color: var(--ink); padding: 16px; display: flex; flex-direction: column; gap: 18px; }
  .cap-h { font: 600 13px/1 var(--font-num); letter-spacing: .14em; text-transform: uppercase; color: #36435c; margin: 0 0 6px; }
  .board { position: relative; width: 844px; height: 390px; overflow: hidden; isolation: isolate; }
  .board.day { background: var(--paper-a); color: var(--ink); }
  .board.night { background: var(--plate); color: var(--on-ink); }
  .board.tall { height: auto; min-height: 390px; padding: 16px; }
  /* (!important: ink.css loads after this sheet, and its fixed layers would cover the whole page) */
  .board :is(.ui-field, .ui-scene, .ui-scrim, .ui-topbar, .ui-host, .ui-sheet.side, .ui-confetti) { position: absolute !important; }
  /* (two classes: the game's components.css loads after this sheet and sets .ui-panel { display: block }) */
  .board .row-f, .row-f.row-f { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .board .col-f, .col-f.col-f { display: flex; flex-direction: column; gap: 10px; }
  .kit-err { margin: 24px; padding: 16px; background: #fff; font: 700 15px/1.4 sans-serif; }
</style>

      <span class="ui-girltile ssr sel" data-face-top="0.3" data-face-bottom="0.62"><img class="card" src="${A.pt}miko-card.webp" alt=""><span class="glow" aria-hidden="true"></span><span class="st"><span class="ui-chip pick" aria-hidden="true"><i data-g="check"></i></span></span><span class="role"><i data-g="sparkle"></i></span><span class="cap"><span class="nm">Miko</span><span class="ui-rar ssr">SSR</span></span></span>
      <span class="ui-girltile ur"><img class="card" src="${A.pt}aoi-card.webp" alt=""><span class="cap"><span class="nm">Aoi</span><span class="lbl">LV</span><span class="num">60</span></span></span>
      <span class="ui-girltile sr locked"><img class="card" src="${A.pt}ruri-card.webp" alt=""><span class="role"><i data-g="paw"></i></span><span class="cap"><i data-g="lock"></i><span class="lbl">Clear 4-5</span></span></span>

    <div class="row-f" style="margin-top:14px">
      <a class="ui-hubtile" style="width:300px;height:150px"><img src="${A.lobby}academy.webp" alt=""><span class="tr"><span class="ui-cd s"><i data-g="clock"></i><span class="t">5d 13h</span></span></span><span class="cap"><span class="lbl">Weekly guest</span><span class="name">Bounty</span></span></a>
      <a class="ui-hubtile locked" style="width:200px;height:150px"><img src="${A.lobby}academy.webp" alt=""><span class="cap"><span class="ui-bdg soon"><i data-g="lock"></i>Coming soon</span><span class="name">PvP · Rival Run</span></span></a>
      <div class="ui-ksheet" style="width:280px;height:150px"><div class="ui-plate-head bleed"><span class="name">Buy · Study Guide</span><a class="ui-ibtn" aria-label="Close"><i data-g="x" class="s"></i></a></div><div style="padding:12px" class="row-f"><span data-tiles="book_rare:2"></span><button class="ui-btn pri dense"><img src="${A.items}coins-128.webp" alt=""><span class="num">6,000</span></button></div></div>

<section>
  <p class="cap-h">7 · Glyphs: 16 / 20 / 24 px on ink and on paper; selected = cyan</p>
  <div class="board night tall ui-night-zone" id="gink" style="width:844px"></div>
  <div class="board day tall" id="gpaper" style="width:844px"></div>

    // the game's item tiles where the mock-up drew its E5 tile (C1)
    for (const host of root.querySelectorAll('[data-tiles]')) {
      for (const part of host.dataset.tiles.split(',')) {
        const [id, n] = part.split(':');
        host.append(itemTile(id, Number(n), { size: 40, onClick: () => {} }));
      }
    }
    // board 6, row 1: item tiles common → legendary, a Mythic one, and a selected ticket beside it (medium 3)
    const items = document.getElementById('kit-items');
    const row = [['coins', 5000], ['book_rare', 3], ['book_superRare', 2], ['book_mythic', 1], ['book_legendary', 1]];
    for (const [id, n] of row) items.append(itemTile(id, n, { size: 56, onClick: () => {} }));
    const selTicket = itemTile('ticket_recruit', 1, { size: 56, onClick: () => {}, selected: true });
    selTicket.dataset.testid = 'kit-item-selected';
    items.append(selTicket);
    // board 6, row 2: gear tiles, the selected one beside an unselected Mythic one (medium 3)
    const gearRow = document.getElementById('kit-gear');
    const roll = (slot, rarity, level, seed) => ({ ...rollGear(createRng(seed), { slot, rarity, level }), uid: `kit-${seed}` });
    const gears = [roll('charm', 'common', 0, 1), roll('ribbon', 'rare', 2, 2), roll('shoes', 'superRare', 4, 3), roll('charm', 'mythic', 3, 4), roll('charm', 'legendary', 8, 5)];
    for (const g of gears) gearRow.append(gearTile(g, { mainIcon: true, onClick: () => {}, testid: `kit-gear-${g.rarity}` }));
    gearRow.append(gearTile(roll('ribbon', 'rare', 1, 6), { mainIcon: true, onClick: () => {}, selected: true, testid: 'kit-gear-selected' }));
    gearRow.append(gearTile(roll('shoes', 'mythic', 0, 7), { mainIcon: true, onClick: () => {}, testid: 'kit-gear-mythic-2' }));

    // board 7: the glyph sheet
    for (const id of ['gink', 'gpaper']) {
      const el = document.getElementById(id);
      el.innerHTML = Object.entries(glyphs.GLYPH_GROUPS).map(([grp, names]) => `<p class="lbl" style="margin:6px 0 8px">${grp}</p><div style="display:flex;flex-wrap:wrap;gap:6px 10px">`
        + names.map((n, i) => `<span title="${n}" style="display:flex;align-items:center;gap:4px;padding:3px 4px;min-width:96px${i === 0 && grp === 'Home rail' ? `;color:${id === 'gink' ? 'var(--cyan)' : 'var(--cyan-ink)'}` : ''}">${glyphs.lineGlyph(n, 'xs').replace('class="g lg xs"', 'class="g lg" style="width:16px;height:16px;--stroke:1.25"')}${glyphs.lineGlyph(n).replace('class="g lg"', 'class="g lg" style="width:20px;height:20px"')}${glyphs.lineGlyph(n).replace('class="g lg"', 'class="g lg" style="width:24px;height:24px"')}<span class="lbl" style="font-size:12px;letter-spacing:.04em;text-transform:none">${n}</span></span>`).join('') + '</div>').join('')
        + `<div style="display:flex;gap:16px;align-items:center;margin-top:12px">${glyphs.emblemSvg('gate', { size: 64 })}${glyphs.emblemSvg('gate', { size: 88 })}${glyphs.emblemSvg('petal', { size: 64 })}${glyphs.emblemSvg('gate', { size: 40 })}<span class="lbl">Chapter emblems: 4 Ironhold Pass (64 / 88), 1 Sakura Gardens, row size 40</span></div>`;
    }
    glyphs.hydrateGlyphs(root);
    // coins and gems wear their colour art (kit.js curArt; owner, Oct 27), every other glyph its line drawing
    const { curArt } = await load('/src/ui/kit.js');
    for (const el of root.querySelectorAll('i[data-cur]')) el.replaceWith(curArt(el.dataset.cur));
    await document.fonts.ready;
    // wait for the images (the item art is lazy: load it now), so a screenshot never catches a half-loaded board
    for (const im of document.images) im.loading = 'eager';
    const loaded = Promise.all([...document.images].map((im) => (im.complete ? null : new Promise((r) => { im.addEventListener('load', r); im.addEventListener('error', r); }))));
    await Promise.race([loaded, new Promise((r) => setTimeout(r, 8000))]);
    document.body.dataset.kitReady = '1';
  } catch (e) {
    console.error(e);
    root.append(Object.assign(document.createElement('p'), { className: 'kit-err', textContent: `The ink kit is not built in this checkout yet (${e.message}).` }));
    document.body.dataset.kitError = String(e.message);
    document.body.dataset.kitReady = '1';
  }
</script>
