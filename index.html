<html lang="en">
  <head>

    <title>Sakura Sentinels</title>

    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23bfe3ff'/%3E%3Cg fill='%23ff7aa8'%3E%3Cellipse cx='32' cy='17' rx='8' ry='13'/%3E%3Cellipse cx='32' cy='17' rx='8' ry='13' transform='rotate(72 32 32)'/%3E%3Cellipse cx='32' cy='17' rx='8' ry='13' transform='rotate(144 32 32)'/%3E%3Cellipse cx='32' cy='17' rx='8' ry='13' transform='rotate(216 32 32)'/%3E%3Cellipse cx='32' cy='17' rx='8' ry='13' transform='rotate(288 32 32)'/%3E%3C/g%3E%3Ccircle cx='32' cy='32' r='6' fill='%23fff3a0'/%3E%3C/svg%3E" />
    <!-- the title screen's painting: start fetching before the scripts (relative = base-path safe) -->
    <link rel="preload" as="image" href="art/lobby/academy.webp" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&family=Nunito:ital,wght@0,700;0,900;1,800;1,900&display=swap" rel="stylesheet" />
    <style>
      /* The loading screen + the loading slime (src/ui/loading/). Inline on purpose: the boot loader
         below draws from the first byte, before any script or stylesheet, and the game reuses the same
         element for every later load. Everything animates transform / opacity only (compositor). */
      .ld { position: fixed; inset: 0; z-index: 370; background: #050608; color: #f3f6ff; visibility: hidden; pointer-events: none; font-family: Nunito, 'M PLUS Rounded 1c', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      .ld.bare { background: transparent; }
      /* shown only once a load passes 150 ms (--ld-delay), on the compositor; the boot's black is there at once */
      .ld.on { visibility: visible; animation: ld-in 160ms ease-out var(--ld-delay, 150ms) both; }
      .ld.on.boot, .ld.on.bare, .ld.on.stay { animation: none; }
      .ld.on.out { animation: ld-out 140ms ease-in both; }
      .ld.on.boot.out { animation-duration: 240ms; }
      .ld.on.wait { pointer-events: auto; }
      .ld.on > * { animation: ld-in 160ms ease-out var(--ld-delay, 150ms) both; }
      .ld.on .sl.pop { animation: sl-pop 300ms cubic-bezier(0.3, 1.5, 0.5, 1) var(--ld-delay, 150ms) both; }
      @keyframes ld-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes ld-out { from { opacity: 1; } to { opacity: 0; } }
      .ld-corner { position: absolute; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: flex-end; gap: 6px; }
      .ld-label { font: italic 900 15px/1 Nunito, 'M PLUS Rounded 1c', system-ui, sans-serif; letter-spacing: 0.08em; padding: 0 0 9px; white-space: nowrap; display: flex; align-items: baseline; }
      .ld-dots { display: inline-flex; gap: 3px; margin-left: 4px; }
      .ld-dots i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; display: block; animation: ld-dot 1.2s linear infinite; }
      .ld-dots i:nth-child(1) { animation-delay: 0.744s; }
      .ld-dots i:nth-child(2) { animation-delay: 0.824s; }
      .ld-dots i:nth-child(3) { animation-delay: 0.904s; }
      /* the slime's landing makes the dots jump, one after the other */
      @keyframes ld-dot { 0% { transform: translateY(0); } 6% { transform: translateY(-6px); animation-timing-function: ease-in; } 13%, 100% { transform: translateY(0); } }
      .ld-left { position: absolute; left: calc(18px + env(safe-area-inset-left, 0px)); right: 220px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 7px; min-width: 0; }
      .ld-ctx { display: flex; align-items: center; gap: 9px; min-width: 0; }
      .ld-ctx[hidden] { display: none; }
      .ld-ctx::before { content: ''; width: 4px; height: 22px; background: #ff7aa8; transform: skewX(-12deg); flex: none; }
      .ld-ctx small { font: italic 900 10px/1 Nunito, system-ui, sans-serif; letter-spacing: 0.22em; color: #7be3a4; text-transform: uppercase; flex: none; }
      .ld-ctx b { font: italic 900 17px/1.1 Nunito, system-ui, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ld-tip { display: flex; align-items: center; gap: 8px; color: #8d97ab; font: 700 12.5px/1.3 Nunito, system-ui, sans-serif; min-width: 0; }
      .ld-tip > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ld-tip > b { flex: none; font: italic 900 10px/1 Nunito, system-ui, sans-serif; letter-spacing: 0.14em; color: #050608; background: #7be3a4; padding: 3px 7px 3px 6px; transform: skewX(-12deg); }
      .ld-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(255, 255, 255, 0.07); visibility: hidden; }
      .ld-bar.known { visibility: visible; }
      .ld-bar i { position: absolute; inset: 0; transform-origin: 0 50%; transform: scaleX(var(--p, 0)); background: linear-gradient(90deg, #7be3a4, #ffb3cb); box-shadow: 0 0 8px rgba(123, 227, 164, 0.6); transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1); }
      @media (min-width: 1000px) and (min-height: 600px) {
        .ld .sl { --s: 80px; }
        .ld-label { font-size: 18px; padding-bottom: 11px; }
        .ld-left { right: 280px; bottom: 24px; }
        .ld-corner { right: 26px; bottom: 22px; }
        .ld-tip { font-size: 14px; }
        .ld-ctx b { font-size: 20px; }
      }
      /* the slime: a mint-jelly mochi with a sakura petal (src/ui/loading/slime.js); one hop = 1.2 s */
      .sl { --s: 64px; position: relative; width: calc(var(--s) * 1.2); height: var(--s); flex: none; }
      .sl-shadow, .sl-hop, .sl-squash, .sl-layer { position: absolute; inset: 0; }
      .sl svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
      .sl-shadow { inset: auto 12% -9% 12%; height: 22%; border-radius: 50%; background: radial-gradient(closest-side, rgba(123, 227, 164, 0.42), rgba(123, 227, 164, 0)); animation: sl-shadow 1.2s linear infinite; }
      .sl.on-light .sl-shadow { background: radial-gradient(closest-side, rgba(29, 78, 137, 0.22), rgba(29, 78, 137, 0)); }
      .sl-hop { animation: sl-hop 1.2s linear infinite; }
      .sl-squash { transform-origin: 50% 94%; animation: sl-squash 1.2s linear infinite; }
      .sl-eyes { transform-origin: 50% 62%; animation: sl-blink 2.4s linear infinite; }
      .sl-petal { transform-origin: 63.3% 25%; animation: sl-petal 1.2s linear infinite; }
      .sl-mouth-o { opacity: 0; animation: sl-mouth-o 1.2s linear infinite; }
      .sl-mouth-s { animation: sl-mouth-s 1.2s linear infinite; }
      .sl-body { filter: drop-shadow(0 0 calc(var(--s) * 0.14) rgba(123, 227, 164, 0.28)); }
      .sl.on-light .sl-body { filter: none; }
      /* anticipation squash → launch stretch → apex → fall stretch → landing squash → wobble */
      @keyframes sl-hop { 0%, 14% { transform: translateY(0); animation-timing-function: cubic-bezier(0.2, 0.6, 0.35, 1); } 42% { transform: translateY(-26%); animation-timing-function: cubic-bezier(0.55, 0, 0.8, 0.45); } 62%, 100% { transform: translateY(0); } }
      @keyframes sl-squash { 0% { transform: scale(1, 1); animation-timing-function: ease-in-out; } 14% { transform: scale(1.14, 0.84); animation-timing-function: cubic-bezier(0.3, 0, 0.3, 1); } 24% { transform: scale(0.88, 1.15); animation-timing-function: ease-out; } 42% { transform: scale(0.98, 1.03); animation-timing-function: ease-in; } 57% { transform: scale(0.92, 1.1); animation-timing-function: ease-in; } 62% { transform: scale(1.2, 0.8); animation-timing-function: ease-out; } 71% { transform: scale(0.95, 1.06); animation-timing-function: ease-in-out; } 80% { transform: scale(1.04, 0.97); animation-timing-function: ease-in-out; } 89% { transform: scale(0.99, 1.01); } 100% { transform: scale(1, 1); } }
      /* the petal lags the body: flattens on launch, perks up at the apex, flops on landing */
      @keyframes sl-petal { 0% { transform: rotate(18deg); animation-timing-function: ease-in-out; } 14% { transform: rotate(12deg); } 26% { transform: rotate(36deg); animation-timing-function: ease-out; } 44% { transform: rotate(2deg); animation-timing-function: ease-in-out; } 58% { transform: rotate(10deg); } 64% { transform: rotate(42deg); animation-timing-function: ease-out; } 73% { transform: rotate(8deg); animation-timing-function: ease-in-out; } 82% { transform: rotate(26deg); } 91% { transform: rotate(15deg); } 100% { transform: rotate(18deg); } }
      /* a blink every second hop, while it rests on the ground */
      @keyframes sl-blink { 0%, 86%, 93%, 100% { transform: scaleY(1); } 89.5% { transform: scaleY(0.08); } }
      /* a little "o!" in the air, a smile on the ground */
      @keyframes sl-mouth-o { 0%, 21% { opacity: 0; } 25%, 54% { opacity: 1; } 58%, 100% { opacity: 0; } }
      @keyframes sl-mouth-s { 0%, 21% { opacity: 1; } 25%, 54% { opacity: 0; } 58%, 100% { opacity: 1; } }
      @keyframes sl-shadow { 0% { transform: scaleX(1); opacity: 0.9; } 14% { transform: scaleX(1.12); opacity: 1; } 42% { transform: scaleX(0.56); opacity: 0.35; } 62% { transform: scaleX(1.22); opacity: 1; } 74%, 100% { transform: scaleX(1); opacity: 0.9; } }
      @keyframes sl-pop { 0% { transform: scale(0.4); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: none; opacity: 1; } }
      /* loops run only while a loader is shown: each show starts from rest, a hidden one costs nothing */
      .ld:not(.on) .sl, .ld:not(.on) .sl *, .ld:not(.on) .ld-dots i { animation: none !important; }
      /* reduced motion: a still, smiling slime and still dots */
      @media (prefers-reduced-motion: reduce) { .sl, .sl *, .ld-dots i { animation: none !important; } }
      html[data-reduce-motion] .sl, html[data-reduce-motion] .sl *, html[data-reduce-motion] .ld-dots i { animation: none !important; }
    </style>
  </head>
  <body>
    <!-- the boot loader: black from the first byte, "Loading" + the slime after 150 ms (src/ui/loading/) -->
    <svg id="ldsl-defs" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><linearGradient id="ldsl-g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecfff3"/><stop offset="0.36" stop-color="#b2f3c9"/><stop offset="0.78" stop-color="#76da9c"/><stop offset="1" stop-color="#4cba78"/></linearGradient><radialGradient id="ldsl-core" cx="0.4" cy="0.36" r="0.55"><stop offset="0" stop-color="#fff" stop-opacity="0.6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><linearGradient id="ldsl-iris" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d152b"/><stop offset="0.55" stop-color="#1b2f52"/><stop offset="1" stop-color="#2f8a8a"/></linearGradient><linearGradient id="ldsl-petal" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff0f5"/><stop offset="0.55" stop-color="#ffaccb"/><stop offset="1" stop-color="#ff79a7"/></linearGradient><symbol id="ldsl-eye" viewBox="-10 -12 20 24" overflow="visible"><ellipse rx="8.6" ry="10.6" fill="url(#ldsl-iris)" stroke="#121a31" stroke-width="1.6"/><path d="M-5.8 4.6C-3 8 3 8 5.8 4.6" stroke="#93f5d0" stroke-width="1.7" fill="none" stroke-linecap="round" opacity="0.8"/><path d="M-8.3 -3C-7.9 -9.6 -4.4 -11.2 0 -11.2C4.4 -11.2 7.9 -9.6 8.3 -3" stroke="#0f1730" stroke-width="2.8" fill="none" stroke-linecap="round"/><circle cx="-2.7" cy="-4.4" r="3.8" fill="#fff"/><circle cx="3.3" cy="3.3" r="1.8" fill="#fff"/></symbol></defs></svg>

<div class="sl-layer sl-mouth-o"><svg viewBox="0 0 120 100"><ellipse cx="60" cy="77" rx="3.6" ry="4.2" fill="#6e1f36" stroke="#162038" stroke-width="1.6"/><ellipse cx="60" cy="79.2" rx="2.2" ry="1.4" fill="#ff8fb3"/></svg></div><div class="sl-layer sl-petal"><svg viewBox="0 0 120 100"><g transform="translate(76 25) scale(1.15)"><path d="M0 0C-8.5 -5 -11 -16.5 -5.8 -25L0 -20.6L5.8 -25C11 -16.5 8.5 -5 0 0Z" fill="url(#ldsl-petal)" stroke="#e8578b" stroke-width="1.2" stroke-linejoin="round"/><path d="M0 -3.2V-15" stroke="#fff" stroke-opacity="0.75" stroke-width="1.3" stroke-linecap="round"/></g></svg></div></div></div></div></div><div class="ld-bar"><i></i></div></div>
