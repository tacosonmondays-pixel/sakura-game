<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner chibi harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  #status { position: fixed; left: 6px; bottom: 6px; z-index: 3; font: 600 12px system-ui; color: #1d2b55; background: #fffd; padding: 3px 7px; border-radius: 6px; }
  #labels div { position: fixed; z-index: 2; transform: translateX(-50%); font: 700 13px system-ui; color: #1d2b55; background: #fffc; padding: 1px 6px; border-radius: 5px; white-space: nowrap; }
  #labels small { display: block; font-weight: 500; font-size: 11px; }
  img.ref { position: fixed; z-index: 1; object-fit: contain; }
</style>
</head>
<body>
<div id="app"></div>
<div id="labels"></div>
<div id="status"></div>
<script type="module" src="./_owner-chibi.js"></script>
</body>
</html>
