<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sim debug view</title>
<style>
  :root { --sky: #cfe8ff; --navy: #1d2b4f; --panel: #ffffff; --muted: #5a6788; --warn: #ff9f1c; --danger: #ff4d6d; --info: #3da5ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--sky); font: 13px/1.35 system-ui, sans-serif; color: var(--navy); }
  header { display: flex; align-items: baseline; gap: 12px; padding: 10px 16px 0; flex-wrap: wrap; }
  h1 { font-style: italic; font-size: 18px; margin: 0; }
  #hud { font-weight: 600; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 12px; padding: 10px 16px 16px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  canvas { width: 100%; background: #9fd18a; border-radius: 10px; box-shadow: 0 2px 8px #0002; display: block; }
  aside { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .card { background: var(--panel); border-radius: 10px; padding: 10px 12px; box-shadow: 0 2px 6px #0002; transform: skewX(-4deg); }
  .card > * { transform: skewX(4deg); }
  .card h2 { font-size: 13px; font-style: italic; margin: 0 0 6px; color: var(--navy); }
  .warn { margin: 4px 0; padding-left: 8px; border-left: 4px solid var(--info); }
  .warn.warn-warn { border-color: var(--warn); }
  .warn.warn-danger { border-color: var(--danger); }
  #log { font: 11px/1.3 ui-monospace, monospace; color: var(--muted); max-height: 160px; overflow: auto; white-space: pre-wrap; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 11px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 3px; vertical-align: -1px; }
</style>
</head>
<body>
<header>
  <h1>Sakura Sentinels — sim debug view</h1>
  <div id="hud"></div>
</header>
<main>
  <canvas id="view"></canvas>
  <aside>
    <div class="card"><h2>Next wave scouting</h2><div id="warnings"></div></div>
    <div class="card"><h2>Debrief</h2><div id="debrief"></div></div>
    <div class="card"><h2>Events</h2><div id="log"></div></div>
    <div class="card"><h2>Legend</h2><div class="legend">
      <span><i style="background:#ffd84d"></i>haste field</span><span><i style="background:#4cc9f0"></i>shield field</span>
      <span><i style="background:#80ed99"></i>regen field</span><span><i style="background:#c77dff"></i>veiled (faded)</span>
      <span><i style="background:#555"></i>trap (bright = armed)</span><span><i style="background:#9ad0ff"></i>barrier bar</span>
    </div></div>
  </aside>
</main>
<script type="module" src="./sim.js"></script>
</body>
</html>
