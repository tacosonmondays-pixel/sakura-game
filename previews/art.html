<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Art gallery</title>
<style>
  body { margin: 0; background: linear-gradient(160deg, #eaf6ff, #cfe8ff); font: 12px/1.35 system-ui, sans-serif; color: #1d2b4f; }
  h1 { font-style: italic; margin: 12px 16px 4px; font-size: 20px; color: #22385c; }
  h2 { font-style: italic; margin: 18px 16px 8px; font-size: 15px; color: #22385c; }
  nav { margin: 0 16px; display: flex; flex-wrap: wrap; gap: 6px; }
  nav a { padding: 4px 10px; border-radius: 4px; background: #fff; color: #22385c; text-decoration: none; font-weight: 700; }
  nav a.on { background: #ffd84d; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 16px; }
  .full { width: 240px; } .portrait { width: 120px; height: 200px; } .thumb { width: 84px; height: 84px; }
  .full svg, .portrait svg, .thumb svg, .ic svg, .map svg, .bd svg { display: block; width: 100%; height: 100%; }
  .ic { width: 64px; text-align: center; font-size: 9px; color: #55607a; word-break: break-all; }
  .ic div { width: 56px; height: 56px; margin: 0 auto 2px; }
  .ic.sm div { width: 40px; height: 40px; } .ic.ui div { width: 28px; height: 28px; color: #22385c; }
  .map { width: 288px; } .map div { height: 180px; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 6px #0002; }
  .bd { width: 440px; height: 160px; border-radius: 8px; overflow: hidden; } .bd.lobby { width: 640px; height: 360px; }
  .cap { font-weight: 700; margin-top: 3px; }
</style>
</head>
<body>
<h1>Sakura Sentinels — art gallery</h1>
<nav id="nav"></nav>
<div id="out"></div>
<script type="module" src="./art.js"></script>
</body>
</html>
