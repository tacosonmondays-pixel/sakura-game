<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roster palettes</title>
<style>
  body { margin: 0; background: #cfe8ff; font: 13px/1.3 system-ui, sans-serif; color: #1d2b4f; }
  h1 { font-style: italic; margin: 12px 16px; font-size: 18px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 0 16px 16px; }
  .card { background: #fff; border-radius: 8px; padding: 8px; box-shadow: 0 2px 6px #0002; }
  .card b { display: block; font-size: 14px; }
  .meta { color: #55607a; font-size: 11px; }
  .sw { display: flex; gap: 2px; margin-top: 6px; }
  .sw i { flex: 1; height: 14px; border-radius: 2px; border: 1px solid #0002; }
  svg { display: block; margin: 0 auto; }
</style>
</head>
<body>
<h1>Sakura Sentinels — roster palettes</h1>
<div id="grid"></div>
<script type="module" src="./units.js"></script>
</body>
</html>
