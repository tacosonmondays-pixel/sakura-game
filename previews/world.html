<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World data</title>
<style>
  body { margin: 0; background: #cfe8ff; font: 12px/1.35 system-ui, sans-serif; color: #1d2b4f; }
  h1 { font-style: italic; margin: 12px 16px 4px; font-size: 18px; }
  h2 { font-style: italic; margin: 14px 16px 6px; font-size: 15px; }
  nav { margin: 0 16px; } nav button { margin-right: 6px; padding: 4px 10px; border: 0; border-radius: 4px; background: #fff; cursor: pointer; }
  nav button.on { background: #ffd84d; font-weight: 700; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; padding: 0 16px 16px; }
  .card { background: #fff; border-radius: 8px; padding: 8px; box-shadow: 0 2px 6px #0002; }
  .card b { font-size: 13px; } .meta { color: #55607a; font-size: 11px; }
  canvas { display: block; width: 100%; image-rendering: pixelated; border-radius: 4px; margin-top: 4px; }
  .tier { display: inline-block; padding: 0 6px; border-radius: 8px; color: #fff; font-size: 10px; }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -2px; border: 2px solid #0003; }
  .tr { display: inline-block; background: #e8f0ff; border-radius: 3px; padding: 0 4px; margin: 1px; font-size: 10px; }
</style>
</head>
<body>
<h1>Sakura Sentinels — world data</h1>
<nav id="nav"></nav>
<div id="out"></div>
<script type="module" src="./world.js"></script>
</body>
</html>
