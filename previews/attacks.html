<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attack FX Preview</title>
<style>
  :root { --navy: #1d2b4f; --sky: #e8f3ff; --yellow: #ffd84d; --cyan: #4cc9f0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #10182c; font: 13px/1.3 system-ui, sans-serif; color: var(--navy); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .tag { position: absolute; left: 0; top: 0; padding: 1px 7px 2px; border-radius: 4px; background: rgba(255,255,255,0.88); box-shadow: 0 1px 3px #0004; white-space: nowrap; font-size: 11px; text-align: center; }
  .tag b { display: block; font-size: 11px; line-height: 1.1; }
  .tag span { font: 10px ui-monospace, monospace; color: #4a5a80; }
  #top { position: fixed; left: 0; right: 0; top: 0; height: 44px; display: flex; gap: 6px; align-items: center; padding: 0 10px; background: linear-gradient(#ffffffee, #f1f6ffe6); box-shadow: 0 2px 8px #0003; z-index: 2; }
  #top .title { font-weight: 900; font-style: italic; margin-right: 8px; white-space: nowrap; }
  .seg { display: flex; border-radius: 6px; overflow: hidden; box-shadow: inset 0 0 0 1.5px #c6d3ec; }
  button { font: inherit; font-weight: 700; color: var(--navy); border: 0; background: transparent; cursor: pointer; padding: 5px 9px; }
  button.on { background: var(--navy); color: #fff; }
  #stats { margin-left: auto; font: 11px ui-monospace, monospace; color: #3a4a70; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #side { position: fixed; right: 0; top: 44px; bottom: 0; width: 300px; background: #f6f9ffee; overflow-y: auto; padding: 8px; z-index: 2; box-shadow: -2px 0 8px #0002; }
  #side h3 { margin: 4px 4px 8px; font-size: 12px; letter-spacing: 0.08em; color: #6a7aa0; }
  .girl { display: flex; align-items: center; gap: 3px; padding: 3px 4px; border-radius: 6px; }
  .girl.sel { background: #dfeaff; }
  .girl .name { flex: 1; text-align: left; padding: 4px 4px; }
  .girl button:not(.name) { font: 10px ui-monospace, monospace; padding: 4px 5px; border-radius: 4px; background: #e6edf9; }
  .girl button.on { background: var(--navy); color: #fff; }
  body.clean #top, body.clean #side { display: none; }
  @media (max-width: 700px), (max-height: 480px) {
    #top { height: 40px; gap: 4px; padding: 0 6px; }
    #top .title { font-size: 12px; margin-right: 2px; }
    button { padding: 4px 6px; font-size: 12px; }
    #stats { display: none; }
    #side { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 56px; padding: 8px 6px; overflow-x: auto; overflow-y: hidden; }
    #side h3 { display: none; }
    #girls { display: flex; gap: 6px; }
    .girl { flex: none; padding: 0; }
    .girl .name { background: #fff; border-radius: 16px; padding: 8px 12px; box-shadow: 0 1px 3px #0003; }
    .girl.sel .name { background: var(--navy); color: #fff; }
    .girl button:not(.name) { display: none; }
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div id="top">
  <span class="title" id="title">Loading…</span>
  <div class="seg"><button id="modeG">Gallery</button><button id="modeF">Focus</button></div>
  <div class="seg"><button id="q_high">H</button><button id="q_medium">M</button><button id="q_low">L</button></div>
  <div class="seg"><button id="speed">1×</button></div>
  <div class="seg"><button id="fxBtn">FX on</button></div>
  <div class="seg"><button id="pause">⏸</button></div>
  <span id="stats"></span>
</div>
<div id="side"><h3>GIRLS · tap a build</h3><div id="girls"></div></div>
<script type="module" src="./attacks.js"></script>
</body>
</html>
