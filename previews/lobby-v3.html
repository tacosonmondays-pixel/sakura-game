<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lobby V3 preview</title>
    <style>
      body { margin: 0; font: 700 12px system-ui; color: #22385c; }
      .pv-icons { display: flex; flex-wrap: wrap; gap: 14px; padding: 16px; }
      .pv-cell { width: 96px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
      .pv-cell svg { width: 72px; height: 72px; }
      .pv-big svg { width: 200px; height: auto; }
      .pv-bg-a { background: linear-gradient(135deg, #cfe8ff, #f4f8ff); }
      .pv-bg-b { background: #6d7f99; color: #fff; }
    </style>

    <div id="app"></div>
